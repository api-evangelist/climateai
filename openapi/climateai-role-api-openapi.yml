openapi: 3.2.0
info:
  title: ClimateAI Platform Role API
  version: '1.0'
  description: ClimateAI authentication and routing gateway for platform services
servers:
- url: /
security:
- jwt: []
tags:
- name: Role
  description: user role related operations
paths:
  /role/:
    post:
      responses:
        '500':
          description: Error creating role.
        '409':
          description: Role already exists.
        '201':
          description: Role successfully created.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/role_response'
      summary: Creates a new Role
      operationId: createANewRole
      tags:
      - Role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/role_payload'
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: create a new role
    get:
      responses:
        '200':
          description: Successfully retrieved roles.
        '500':
          description: Error retrieving roles.
        '204':
          description: No roles found.
      operationId: GetAllRoles
      tags:
      - Role
      summary: Get all roles
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Get all roles
  /role/{role_id}:
    parameters:
    - in: path
      description: The role id
      name: role_id
      required: true
      schema:
        type: string
    put:
      responses:
        '404':
          description: Role not found.
        '500':
          description: Error updating role.
        '201':
          description: Role successfully updated.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/role_response'
      summary: Updates a role
      operationId: updateARole
      tags:
      - Role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/role_payload'
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: update a role
    delete:
      responses:
        '404':
          description: Role not found.
        '500':
          description: Error deleting role.
        '200':
          description: Role successfully deleted.
      summary: Deletes a role by id
      operationId: deleteARole
      tags:
      - Role
      x-operation-id-source: normalized
      x-operation-id-original: delete a role
    get:
      responses:
        '404':
          description: Role not found.
        '500':
          description: Error fetching role.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/role_response'
      operationId: fetchARole
      tags:
      - Role
      summary: Fetch a role
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: fetch a role
  /role/{role_id}/permission/{permission_id}:
    parameters:
    - in: path
      description: The permission id
      name: permission_id
      required: true
      schema:
        type: string
    - in: path
      description: The role id
      name: role_id
      required: true
      schema:
        type: string
    post:
      responses:
        '404':
          description: Role or permission not found.
        '500':
          description: Error adding association.
        '409':
          description: Association already exists.
        '201':
          description: Association successfully added.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/role_response'
      summary: Adds a new Role/Permission association
      operationId: addAPermissionToARole
      tags:
      - Role
      x-operation-id-source: normalized
      x-operation-id-original: add a permission to a role
    delete:
      responses:
        '404':
          description: Association does not exist.
        '500':
          description: Error removing association.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/role_response'
      summary: Removes a Role/Permission association
      operationId: removeAPermissionFromARole
      tags:
      - Role
      x-operation-id-source: normalized
      x-operation-id-original: remove a permission from a role
components:
  schemas:
    role_response:
      required:
      - created_at
      - description
      - id
      - name
      - updated_at
      properties:
        id:
          type: string
          description: role identifier
        created_at:
          type: string
          description: created timestamp
        updated_at:
          type: string
          description: last updated timestamp
        permissions:
          type: array
          description: role permissions
          items:
            $ref: '#/components/schemas/permission_response'
        name:
          type: string
          description: role name
        description:
          type: string
          description: role description
      type: object
    role_payload:
      required:
      - description
      - name
      properties:
        name:
          type: string
          description: role name
        description:
          type: string
          description: role description
      type: object
      additionalProperties: false
    permission_response:
      required:
      - created_at
      - id
      - name
      - updated_at
      properties:
        id:
          type: string
          description: permission identifier
        created_at:
          type: string
          description: created timestamp
        updated_at:
          type: string
          description: last updated timestamp
        name:
          type: string
          description: permission name
      type: object
  securitySchemes:
    jwt:
      type: apiKey
      in: header
      name: Authorization
    apikey:
      type: apiKey
      in: header
      name: X-Api-Key
