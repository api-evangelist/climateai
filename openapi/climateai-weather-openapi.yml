openapi: 3.1.1
info:
  title: ClimateAI Weather API
  version: 2.0.1
  description: >-
    OpenAPI specification for the ClimateAI Weather API.


    Forecasts, historical observations, and climatology for any point on Earth,
    accessible by latitude and longitude.


    Endpoints are grouped by version:


    - **Current (v2)** — recommended for new integrations. Multi-timescale
    forecasts (short-term through seasonal in a single call), custom quantiles,
    configurable granularity, and date-range control. All paths start with
    `/v2/`.

    - **Legacy (v1)** — original endpoints. Stable and fully supported, but
    superseded by v2 where noted: `/v1/history` → `/v2/history`; the three
    legacy forecast endpoints (short-term, subseasonal, seasonal) →
    `/v2/forecast`.


    See the **Datasets** section for the full variable-availability matrix
    (which variable is in which dataset, units, granularities, resolution, and
    statistics).


    # Authentication


    All endpoints require an API key, sent in the `X-Api-Key` header. Contact
    our sales team to get your API key.
  contact:
    name: API Support
    url: https://api.climate.ai/
    email: customersuccess@climate.ai
  x-logo:
    url: https://climate.ai/wp-content/uploads/2022/09/Logo_orange_dark.png
    altText: ClimateAI Logo
servers:
  - url: https://api-prod.climate.ai/weather
    description: ClimateAI Weather API (production)
  - url: http://localhost:5000
    description: Local development
security:
  - ApiKeyAuth: []
tags:
  - name: Current (v2)
    description: >
      Modern endpoints (recommended). Faster grid-index lookups, blended
      multi-model forecasts, explicit downscaling control, and a compact,
      date-keyed response shape. All paths start with `/v2/`.
  - name: Legacy (v1)
    description: >
      Original endpoints. Stable and supported, but superseded by the Current
      (v2) endpoints where noted. Default response shape is the `{ meta, data }`
      envelope, where each `data` entry nests its per-variable values under
      `attributes`.
  - name: Datasets
    description: >
      ClimateAI exposes weather data through two API versions.


      **Current (v2)** — recommended. Two endpoints covering history and
      forecast:

      - `GET /v2/history/` — 30+ years of ERA5 history with grid-optimized
      lookups

      - `GET /v2/forecast/` — blended stitched forecast (raw ensemble members)

      - `GET /v2/forecast/statistics/` — stitched forecast statistics (mean +
      quantiles)


      **Legacy (v1)** — the original per-dataset endpoints (climatology,
      history,

      short-term, subseasonal, seasonal). Still supported.


      ---


      ## Current Endpoints (v2) — Queryable Variables


      | Variable | Query Value | Units | History | Forecast |

      | :---: | :---: | :---: | :---: | :---: |

      | Mean Temperature | `temp_mean` | degrees_C | ✔ | ✔ |

      | Max Temperature | `temp_max` | degrees_C | ✔ | ✔ |

      | Min Temperature | `temp_min` | degrees_C | ✔ | ✔ |

      | Precipitation | `precipitation` | mm | ✔ | ✔ |

      | Soil Temperature | `soil_temperature` | degrees_C | ✔ | ✔ |

      | Relative Humidity | `humidity` | percent | ✔ | ✔ |

      | Evapotranspiration | `evapotranspiration` | mm | ✔ | ✔ |

      | Solar Radiation | `solar_radiation` | W/m2 | ✔ | ✔ |

      | Soil Moisture | `soil_moisture` | m3/m3 | ✔ | ✔* |

      | Mean Wind Speed | `wind_speed` | km/h | ✔ | ✔ |

      | Max Wind Speed | `max_wind_speed` | km/h | ✔ | ✔** |

      | Max Wind Gust | `max_wind_gust` | km/h | ✔ | ✔** |


      _*Soil moisture is not available in the seasonal segment of the stitched
      forecast._

      _**Max wind speed and max wind gust are available in the short-term
      segment only._


      ### History (v2) — `/v2/history/`

      - **Granularity:** daily, weekly, monthly

      - **Resolution:** 0.25° (temp & solar radiation downscalable to 0.0083°**)

      - **Statistics:** values

      - **Coverage:** 30+ years (ERA5, auto-fetched on first request)


      ### Forecast (v2) — `/v2/forecast/`, `/v2/forecast/statistics/`

      - **Granularity:** daily, weekly, monthly

      - **Resolution:** 0.25° (temp & solar radiation downscalable to 0.0083°**)

      - **Statistics:** raw ensemble members (`/v2/forecast/`) or mean +
      configurable quantiles (`/v2/forecast/statistics/`)

      - **Coverage:** short-term (~15 days) → subseasonal (up to 6 weeks) →
      seasonal (up to 6 months), stitched into one continuous timeline


      ---


      ## Legacy Endpoints (v1) — Queryable Variables


      | Variable | Query Value | Units | History | Climatology | Short-Term |
      Subseasonal | Seasonal |

      | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |

      | Mean Temperature | `temp_mean` | °C | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Max Temperature | `temp_max` | °C | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Min Temperature | `temp_min` | °C | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Precipitation | `precipitation` | mm | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Soil Temperature | `soil_temperature` | °C | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Relative Humidity | `humidity` | % | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Evapotranspiration | `evapotranspiration` | mm | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Solar Radiation | `solar_radiation` | W/m² | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Soil Moisture | `soil_moisture` | m³/m³ | ✔ | ✔ | ✔ | ✔ | ✖ |

      | Mean Wind Speed | `wind_speed` | km/h | ✔ | ✔ | ✔ | ✔ | ✔ |

      | Max Wind Speed | `max_wind_speed` | km/h | ✔ | ✔ | ✔ | ✖ | ✖ |

      | Max Wind Gust | `max_wind_gust` | km/h | ✔ | ✔ | ✔ | ✖ | ✖ |


      ### History (v1) — `/v1/history/`

      - **Granularity:** daily

      - **Resolution:** 0.25° (temp & solar radiation downscalable to 0.0083°**)

      - **Statistics:** values

      - **Coverage:** last 366 days (use `/v2/history/` for 30+ years)


      ### Climatology (v1) — `/v1/climatology/`

      - **Granularity:** daily, weekly, monthly

      - **Resolution:** 0.25° (temp & solar radiation downscalable to 0.0083°**)

      - **Statistics:** quantiles [0.05, 0.25, 0.50, 0.75, 0.95]


      ### Short-term Forecast (v1) — `/v1/forecast/short-term/`

      - **Granularity:** daily

      - **Resolution:** 0.25° (temp & solar radiation downscalable to 0.0083°**)

      - **Statistics:** ensemble mean and quantiles [0.05, 0.25, 0.50, 0.75,
      0.95]

      - *Max Wind Gust is available only for the first 10 days of the forecast.*


      ### Subseasonal Forecast (v1) — `/v1/forecast/subseasonal/`

      - **Granularity:** daily, weekly

      - **Resolution:** 0.25° (temp & solar radiation downscalable to 0.0083°**)

      - **Statistics:** daily → ensemble mean and quantiles [0.05, 0.25, 0.50,
      0.75, 0.95];
        weekly → also probabilistic ranges [0.00–0.33, 0.33–0.67, 0.67–1.0]

      ### Seasonal Forecast (v1) — `/v1/forecast/seasonal/`

      - **Granularity:** daily, monthly

      - **Resolution:** 0.25° (temp & solar radiation downscalable to 0.0083°**)

      - **Statistics:** daily → ensemble mean and quantiles [0.05, 0.25, 0.50,
      0.75, 0.95];
        monthly → also probabilistic ranges [0.00–0.33, 0.33–0.67, 0.67–1.0]

      _**Downscaled resolution (0.0083°) is available per request. Contact the

      sales team for more information. Not applied by default._
paths:
  /v2/history:
    get:
      tags:
        - Current (v2)
      summary: Historical weather (optimized grid lookup)
      description: >
        Historical weather for a coordinate pair using B-tree indexes on

        pre-computed grid indices (`lat_idx`, `lon_idx`) instead of PostGIS

        geography-based GIST indexes — significantly faster lookups.


        Provides 30+ years of ERA5 coverage (auto-fetched on first request),

        automatic recent-history gap-filling, variable-aware temporal

        aggregation, and optional ~1 km downscaling.


        Granularity controls how the daily values are aggregated:


        - `daily` → dates like `2025-01-15` (every day through the inclusive
        `end_date`)

        - `weekly` → ISO weeks like `2025-W03` (Mon–Sun, complete weeks only)

        - `monthly` → months like `2025-01` (complete calendar months only)


        Coordinates are snapped to the 0.25° grid. When both `start_date` and

        `end_date` are omitted, returns roughly the last 3 months.
      operationId: getHistoryGrid
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/HistoryVarQuery"
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/GranularityFullQuery"
        - $ref: "#/components/parameters/UseDownscalingQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactWeatherResponse"
              examples:
                daily:
                  $ref: "#/components/examples/GridDaily"
                weekly:
                  $ref: "#/components/examples/GridWeekly"
                monthly:
                  $ref: "#/components/examples/GridMonthly"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v2/forecast:
    get:
      tags:
        - Current (v2)
      summary: Stitched forecast — raw ensemble members
      description: >
        Blended forecast that stitches short-term (~15 days), subseasonal (up to
        6 weeks), and seasonal (up to 6 months) horizons into a single
        continuous timeline, returning the raw ensemble members (~31 values per
        date).


        Pick exactly the variables you need. Optional ~1 km downscaling for
        select variables.
      operationId: getStitchedForecast
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/StitchedVarQuery"
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/UseDownscalingQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StitchedForecastResponse"
              examples:
                forecast:
                  $ref: "#/components/examples/StitchedForecast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v2/forecast/statistics:
    get:
      tags:
        - Current (v2)
      summary: Stitched forecast — statistics (mean + quantiles)
      description: >
        Statistical aggregations (mean plus configurable quantiles) over the

        stitched ensemble, with optional temporal aggregation.


        Temporal aggregation is variable-aware: precipitation and evaporation

        are **summed**; temperature, humidity, and wind are **averaged** before

        statistics are computed.


        - `daily` → dates like `2025-01-15`

        - `weekly` → ISO weeks like `2025-W03` (Mon–Sun, complete weeks plus the
        current week)

        - `monthly` → months like `2025-01` (complete calendar months plus the
        current month)


        For weekly and monthly granularity the response also includes the

        **current (in-progress) period**: days that have already elapsed use

        observed history values and the remaining days use the forecast, so the

        period reflects the full calendar week/month rather than only its

        remaining forecast days. The `current_period` response object states

        which period this is and where the observed/forecast boundary lies.
      operationId: getStitchedForecastStatistics
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/StitchedVarQuery"
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/UseDownscalingQuery"
        - $ref: "#/components/parameters/StatisticsQuery"
        - $ref: "#/components/parameters/GranularityFullQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StitchedForecastStatisticsResponse"
              examples:
                daily:
                  $ref: "#/components/examples/StitchedStatsDaily"
                weekly:
                  $ref: "#/components/examples/StitchedStatsWeekly"
                monthly:
                  $ref: "#/components/examples/StitchedStatsMonthly"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/climatology:
    get:
      tags:
        - Legacy (v1)
      summary: Climatology by coordinates
      description: Long-term climate averages and quantiles for a coordinate pair.
      operationId: getClimatology
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/VarFullQuery"
        - $ref: "#/components/parameters/GranularityFullQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimatologyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/climatology/location/{id}:
    get:
      tags:
        - Legacy (v1)
      summary: Climatology by stored location ID
      operationId: getClimatologyByLocation
      parameters:
        - $ref: "#/components/parameters/LocationIdPath"
        - $ref: "#/components/parameters/VarFullQuery"
        - $ref: "#/components/parameters/GranularityFullQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimatologyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/history:
    get:
      tags:
        - Legacy (v1)
      summary: Historical observations by coordinates
      description: >
        Historical weather observations for a coordinate pair (last 366 days).
        **Superseded by** `GET /v2/history/`, which provides 30+ years of
        coverage, automatic gap-filling, and faster grid-index lookups.
      operationId: getHistory
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/VarFullQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/history/location/{id}:
    get:
      tags:
        - Legacy (v1)
      summary: Historical observations by stored location ID
      operationId: getHistoryByLocation
      parameters:
        - $ref: "#/components/parameters/LocationIdPath"
        - $ref: "#/components/parameters/VarFullQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/forecast/short-term:
    get:
      tags:
        - Legacy (v1)
      summary: Short-term forecast by coordinates
      description: >
        Short-term forecast (next days to weeks) for a coordinate pair.
        **Superseded by** `GET /v2/forecast/`, which blends short-term,
        subseasonal, and seasonal models into one continuous timeline.
      operationId: getShortTermForecast
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/VarFullQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDatasetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/forecast/subseasonal:
    get:
      tags:
        - Legacy (v1)
      summary: Subseasonal forecast by coordinates
      operationId: getSubseasonalForecast
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/VarSubseasonalQuery"
        - $ref: "#/components/parameters/GranularitySubseasonalQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDatasetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/forecast/seasonal:
    get:
      tags:
        - Legacy (v1)
      summary: Seasonal forecast by coordinates
      operationId: getSeasonalForecast
      parameters:
        - $ref: "#/components/parameters/LatQuery"
        - $ref: "#/components/parameters/LonQuery"
        - $ref: "#/components/parameters/VarSeasonalQuery"
        - $ref: "#/components/parameters/GranularitySeasonalQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDatasetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/forecast/short-term/location/{id}:
    get:
      tags:
        - Legacy (v1)
      summary: Short-term forecast by stored location ID
      operationId: getShortTermForecastByLocation
      parameters:
        - $ref: "#/components/parameters/LocationIdPath"
        - $ref: "#/components/parameters/VarFullQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDatasetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/forecast/subseasonal/location/{id}:
    get:
      tags:
        - Legacy (v1)
      summary: Subseasonal forecast by stored location ID
      operationId: getSubseasonalForecastByLocation
      parameters:
        - $ref: "#/components/parameters/LocationIdPath"
        - $ref: "#/components/parameters/VarSubseasonalQuery"
        - $ref: "#/components/parameters/GranularitySubseasonalQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDatasetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/forecast/seasonal/location/{id}:
    get:
      tags:
        - Legacy (v1)
      summary: Seasonal forecast by stored location ID
      operationId: getSeasonalForecastByLocation
      parameters:
        - $ref: "#/components/parameters/LocationIdPath"
        - $ref: "#/components/parameters/VarSeasonalQuery"
        - $ref: "#/components/parameters/GranularitySeasonalQuery"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDatasetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key for authenticating requests. Contact sales to obtain one.
  parameters:
    LatQuery:
      name: lat
      in: query
      required: true
      description: Latitude coordinate in decimal degrees.
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
        examples:
          - 9.119
    LonQuery:
      name: lon
      in: query
      required: true
      description: Longitude coordinate in decimal degrees.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
        examples:
          - -79.4021
    LocationIdPath:
      name: id
      in: path
      required: true
      description: Stored location identifier.
      schema:
        type: string
    VarFullQuery:
      name: var
      in: query
      required: false
      description: >
        Comma-separated list of variables (e.g. `temp_mean,precipitation`). If
        omitted, all available variables are returned. See the Datasets section
        for units and availability.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/WeatherVariableFull"
        examples:
          - - temp_mean
            - precipitation
    VarSubseasonalQuery:
      name: var
      in: query
      required: false
      description: >
        Comma-separated list of variables. Subseasonal does not provide
        `max_wind_speed` or `max_wind_gust`. If omitted, all available variables
        are returned.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/WeatherVariableSubseasonal"
        examples:
          - - temp_mean
            - precipitation
    VarSeasonalQuery:
      name: var
      in: query
      required: false
      description: >
        Comma-separated list of variables. Seasonal does not provide
        `soil_moisture`, `max_wind_speed`, or `max_wind_gust`. If omitted, all
        available variables are returned.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/WeatherVariableSeasonal"
        examples:
          - - temp_mean
            - precipitation
    StitchedVarQuery:
      name: var
      in: query
      required: false
      description: >
        Weather variable(s). Supports comma-separated values
        (`var=temp_mean,precipitation`) or repeated parameters
        (`var=temp_mean&var=precipitation`). If omitted, all available variables
        are returned.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/WeatherVariableFull"
        examples:
          - - temp_mean
            - precipitation
    HistoryVarQuery:
      name: var
      in: query
      required: false
      description: >
        Weather variable(s). Supports comma-separated values
        (`var=temp_mean,precipitation`) or repeated parameters
        (`var=temp_mean&var=precipitation`). If omitted, all available variables
        are returned. See the Datasets section for units and availability.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/WeatherVariableFull"
        examples:
          - - temp_mean
            - precipitation
    GranularityFullQuery:
      name: granularity
      in: query
      required: false
      description: Temporal granularity of the returned data.
      schema:
        type: string
        enum:
          - daily
          - weekly
          - monthly
        default: daily
    GranularitySubseasonalQuery:
      name: granularity
      in: query
      required: false
      description: Temporal granularity. Subseasonal supports daily and weekly only.
      schema:
        type: string
        enum:
          - daily
          - weekly
        default: daily
    GranularitySeasonalQuery:
      name: granularity
      in: query
      required: false
      description: Temporal granularity. Seasonal supports daily and monthly only.
      schema:
        type: string
        enum:
          - daily
          - monthly
        default: daily
    StartDateQuery:
      name: start_date
      in: query
      required: false
      description: Start date (inclusive) in `YYYY-MM-DD` format.
      schema:
        type: string
        format: date
        examples:
          - 1995-01-01
    EndDateQuery:
      name: end_date
      in: query
      required: false
      description: End date (inclusive) in `YYYY-MM-DD` format.
      schema:
        type: string
        format: date
        examples:
          - 2025-12-31
    UseDownscalingQuery:
      name: use_downscaling
      in: query
      required: false
      description: Apply ~1 km downscaling when available.
      schema:
        type: boolean
        default: true
    StatisticsQuery:
      name: statistics
      in: query
      required: false
      description: >
        Quantile values to compute, each between 0.0 and 1.0. The mean is always
        included. Maximum 20 quantiles per request. Supports comma-separated
        values (`statistics=0.10,0.50,0.90`) or repeated parameters
        (`statistics=0.10&statistics=0.50`).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 1
        default:
          - 0.05
          - 0.25
          - 0.5
          - 0.75
          - 0.95
        examples:
          - - 0.1
            - 0.5
            - 0.9
  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                message: Invalid Location. Latitude must be between 90.0 and -90.0
                code: VALIDATION_ERROR
    NotFound:
      description: No data found for the requested parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                message: No data found for the requested parameters
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                message: Internal server error
