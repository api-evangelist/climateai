  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
          examples:
            - Input validation failed
        code:
          type: string
          description: Machine-readable error code (when available).
          examples:
            - VALIDATION_ERROR
    Coordinates:
      type: object
      description: A latitude/longitude pair.
      properties:
        lat:
          type: number
          format: double
          examples:
            - 9.119
        lon:
          type: number
          format: double
          examples:
            - -79.4021
    MetaLocation:
      type: object
      description: Resolved location of the served data.
      properties:
        latitude:
          type: string
          examples:
            - "9.12"
        longitude:
          type: string
          examples:
            - "-79.40"
    WeatherVariableFull:
      type: string
      description: >
        Variable available for History, Climatology, and Short-term Forecast.
        See the Datasets section for units.
      enum:
        - evapotranspiration
        - humidity
        - soil_moisture
        - solar_radiation
        - soil_temperature
        - temp_mean
        - temp_max
        - temp_min
        - precipitation
        - wind_speed
        - max_wind_speed
        - max_wind_gust
    WeatherVariableSubseasonal:
      type: string
      description: Variable available for the Subseasonal Forecast.
      enum:
        - evapotranspiration
        - humidity
        - soil_moisture
        - solar_radiation
        - soil_temperature
        - temp_mean
        - temp_max
        - temp_min
        - precipitation
        - wind_speed
    WeatherVariableSeasonal:
      type: string
      description: Variable available for the Seasonal Forecast.
      enum:
        - evapotranspiration
        - humidity
        - solar_radiation
        - soil_temperature
        - temp_mean
        - temp_max
        - temp_min
        - precipitation
        - wind_speed
    LegacyMeta:
      type: object
      properties:
        variables:
          type: array
          description: Variables included in the payload.
          items:
            type: string
          examples:
            - - temp_mean
              - precipitation
        granularity:
          type: string
          description: Temporal granularity of the data.
          enum:
            - hour
            - day
            - week
            - month
          examples:
            - day
        location:
          $ref: "#/components/schemas/MetaLocation"
        data_version:
          type:
            - string
            - "null"
          description: Identifier of the dataset version that produced the data.
          examples:
            - forecast-v1
        statistics:
          type: array
          description: Statistical measures present in the dataset.
          items:
            type: string
          examples:
            - - ensemble_mean
              - quantile_0.05
              - quantile_0.50
              - quantile_0.95
        data_downscaled:
          type: boolean
          description: Whether the data was spatially downscaled.
          examples:
            - false
    ForecastStatisticsModel:
      type: object
      description: Per-variable forecast statistics.
      properties:
        units:
          type: string
          examples:
            - mm
        ensemble_mean:
          type: number
          examples:
            - 20.53
        quantile:
          type: object
          additionalProperties:
            type: number
          examples:
            - quantile_0.05: 7.59
              quantile_0.50: 21.16
              quantile_0.95: 31.5
        probability:
          type: object
          description: Climatological probability ranges (weekly/monthly only).
          additionalProperties:
            type: number
          examples:
            - clim_prob_0.00-0.33: 0.53
              clim_prob_0.33-0.67: 0.1
              clim_prob_0.67-1.00: 0.37
    ClimatologyStatisticsModel:
      type: object
      description: Per-variable climatology statistics.
      properties:
        units:
          type: string
          examples:
            - mm
        quantile:
          type: object
          additionalProperties:
            type: number
          examples:
            - quantile_0.05: 7.59
              quantile_0.50: 21.16
              quantile_0.95: 31.5
        probability:
          type: object
          additionalProperties:
            type: number
    HistoryStatisticsModel:
      type: object
      description: Per-variable historical values.
      properties:
        units:
          type: string
          examples:
            - mm
        values:
          type: number
          examples:
            - 20.53
        quantile:
          type: object
          additionalProperties:
            type: number
        probability:
          type: object
          additionalProperties:
            type: number
    ForecastTimeStep:
      type: object
      description: One timestep; variable values are nested under `attributes`.
      properties:
        date:
          type: string
          format: date
          examples:
            - 2025-09-01
        type:
          type: string
          examples:
            - Short-term Forecast
        id:
          type: integer
          examples:
            - 0
        attributes:
          type: object
          description: One entry per variable in `meta.variables`.
          additionalProperties:
            $ref: "#/components/schemas/ForecastStatisticsModel"
          examples:
            - temp_mean:
                units: °C
                ensemble_mean: 20.53
                quantile:
                  quantile_0.05: 18.1
                  quantile_0.50: 20.4
                  quantile_0.95: 23
    ClimatologyTimeStep:
      type: object
      properties:
        date:
          type: string
          format: date
          examples:
            - 2025-09-01
        type:
          type: string
          examples:
            - Climatology
        id:
          type: integer
          examples:
            - 0
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClimatologyStatisticsModel"
          examples:
            - temp_mean:
                units: °C
                quantile:
                  quantile_0.05: 14.2
                  quantile_0.50: 16.7
                  quantile_0.95: 19.1
    HistoryTimeStep:
      type: object
      properties:
        date:
          type: string
          format: date
          examples:
            - 2022-09-01
        type:
          type: string
          examples:
            - History
        id:
          type: integer
          examples:
            - 0
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HistoryStatisticsModel"
          examples:
            - precipitation:
                units: mm
                values: 3.2
    ForecastDatasetResponse:
      type: object
      description: Default envelope for legacy short-term, subseasonal, and seasonal
        forecasts.
      properties:
        meta:
          $ref: "#/components/schemas/LegacyMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ForecastTimeStep"
      examples:
        - meta:
            variables:
              - temp_mean
              - precipitation
            granularity: day
            location:
              latitude: "39.70"
              longitude: "-100.10"
            data_version: forecast-v1
            statistics:
              - ensemble_mean
              - quantile_0.05
              - quantile_0.50
              - quantile_0.95
            data_downscaled: false
          data:
            - date: 2025-09-01
              type: Short-term Forecast
              id: 0
              attributes:
                temp_mean:
                  units: °C
                  ensemble_mean: 20.53
                  quantile:
                    quantile_0.05: 18.1
                    quantile_0.50: 20.4
                    quantile_0.95: 23
                precipitation:
                  units: mm
                  ensemble_mean: 3.2
                  quantile:
                    quantile_0.05: 0
                    quantile_0.50: 2.1
                    quantile_0.95: 9.8
    ClimatologyResponse:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/LegacyMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClimatologyTimeStep"
      examples:
        - meta:
            variables:
              - temp_mean
            granularity: month
            location:
              latitude: "39.70"
              longitude: "-100.10"
            data_version: climatology-v1
            statistics:
              - quantile_0.05
              - quantile_0.50
              - quantile_0.95
            data_downscaled: false
          data:
            - date: 2022-09-01
              type: Climatology
              id: 0
              attributes:
                temp_mean:
                  units: °C
                  quantile:
                    quantile_0.05: 14.2
                    quantile_0.50: 16.7
                    quantile_0.95: 19.1
    HistoryResponse:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/LegacyMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/HistoryTimeStep"
      examples:
        - meta:
            variables:
              - precipitation
            granularity: day
            location:
              latitude: "39.70"
              longitude: "-100.10"
            data_version: history-v1
            statistics:
              - values
            data_downscaled: false
          data:
            - date: 2022-09-01
              type: History
              id: 0
              attributes:
                precipitation:
                  units: mm
                  values: 3.2
    CompactWeatherResponse:
      type: object
      description: Compact, date-keyed weather response.
      properties:
        created_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp when this response was generated.
          examples:
            - 2026-01-15T12:00:00Z
        kind:
          type: string
          description: Data category. Always `history` for this endpoint.
          examples:
            - history
        location:
          $ref: "#/components/schemas/CompactLocation"
        variables:
          type: object
          description: Map of variable name to its data and metadata.
          additionalProperties:
            $ref: "#/components/schemas/CompactVariable"
          examples:
            - temp_mean:
                downscaled: true
                units: degrees_C
                values:
                  2025-01-01: 1.4
                  2025-01-02: 2.1
        granularity:
          type: string
          description: Temporal granularity of the data (echoes the request param).
          enum:
            - daily
            - weekly
            - monthly
          examples:
            - daily
      examples:
        - created_at: 2026-01-15T12:00:00Z
          kind: history
          location:
            requested:
              lat: 40
              lon: -89
            resolved:
              lat: 40
              lon: -89
          granularity: daily
          variables:
            temp_mean:
              downscaled: true
              units: degrees_C
              values:
                2025-01-01: 1.4
                2025-01-02: 2.1
    CompactLocation:
      type: object
      description: >
        Requested coordinates, the resolved grid coordinates actually used, and
        (when downscaling is applied) the downscaled coordinates.
      properties:
        requested:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: The exact coordinates the client sent in the request.
        resolved:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: The nearest 0.25° grid point used to serve the data. The API snaps
            the requested coordinates to this grid point.
        downscaled:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: Downscaled coordinates. Only present when downscaling is applied.
    CompactVariable:
      type: object
      properties:
        downscaled:
          type: boolean
          examples:
            - true
        units:
          type: string
          examples:
            - degrees_C
        values:
          type: object
          description: Data points keyed by date/week/month.
          additionalProperties:
            type: number
          examples:
            - 2025-01-01: 1.4
              2025-01-02: 2.1
    StitchedForecastResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp when this response was generated.
          examples:
            - 2025-09-18T12:00:00Z
        init_time:
          type: string
          format: date-time
          description: Forecast initialization time — the model run date whose output is
            being served. All ensemble members originate from this run.
          examples:
            - 2025-09-18T12:00:00Z
        kind:
          type: string
          description: Data category. Always `forecast` for this endpoint.
          examples:
            - forecast
        location:
          $ref: "#/components/schemas/StitchedLocation"
        granularity:
          type: string
          description: Temporal granularity of the data (echoes the request param).
          examples:
            - daily
        variables:
          type: object
          description: Map of variable name to its ensemble data and metadata. Keys are
            variable names (temp_mean, precipitation, humidity, etc.) based on
            request.
          additionalProperties:
            $ref: "#/components/schemas/StitchedVariableData"
          examples:
            - temp_mean:
                units: degrees_C
                downscaled: true
                version: v2.1.0
                generation: stitch-gen-123-2025-09-18-12Z
                values:
                  2025-09-19:
                    - 15.2
                    - 15.8
                    - 16.1
      examples:
        - created_at: 2025-09-18T12:00:00Z
          init_time: 2025-09-18T12:00:00Z
          kind: forecast
          location:
            requested:
              lat: 9.119
              lon: -79.4021
            resolved:
              lat: 9.12
              lon: -79.4
          granularity: daily
          variables:
            temp_mean:
              units: degrees_C
              downscaled: true
              version: v2.1.0
              generation: stitch-gen-123-2025-09-18-12Z
              values:
                2025-09-19:
                  - 15.2
                  - 15.8
                  - 16.1
                2025-09-20:
                  - 15.9
                  - 16.3
                  - 16.7
    StitchedLocation:
      type: object
      description: >
        Requested coordinates, the resolved grid coordinates actually used, and
        (when downscaling is applied) the downscaled coordinates.
      properties:
        requested:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: The exact coordinates the client sent in the request.
        resolved:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: The nearest 0.25° grid point used to serve the data. The API snaps
            the requested coordinates to this grid point.
        downscaled:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: Downscaled coordinates. Only present when downscaling is applied.
    StitchedVariableData:
      type: object
      properties:
        units:
          type: string
          description: Physical unit of the values (e.g. degrees_C, mm, percent, W/m2,
            km/h).
          examples:
            - degrees_C
        downscaled:
          type: boolean
          description: Whether ~1 km downscaling was applied to this variable.
          examples:
            - true
        version:
          type: string
          description: Dataset version identifier. Tracks the model pipeline version that
            produced the data (e.g. debiasing model, stitching algorithm).
            Changes when the pipeline is updated.
          examples:
            - v2.1.0
        generation:
          type: string
          description: Unique identifier for the specific data generation run. Combines
            the stitching job ID and the init_time. Use this to detect when
            fresh data is available or to reference a specific forecast vintage.
          examples:
            - stitch-gen-123-2025-09-18-12Z
        values:
          type: object
          description: Time series keyed by date; each value is an array of ensemble
            member values.
          additionalProperties:
            type: array
            items:
              type: number
          examples:
            - 2025-09-19:
                - 15.2
                - 15.8
                - 16.1
    StitchedForecastStatisticsResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp when this response was generated.
          examples:
            - 2025-09-18T12:00:00Z
        init_time:
          type: string
          format: date-time
          description: Forecast initialization time — the model run date whose output is
            being served. All ensemble members originate from this run.
          examples:
            - 2025-09-18T12:00:00Z
        kind:
          type: string
          description: Data category. Always `forecast` for this endpoint.
          examples:
            - forecast
        location:
          $ref: "#/components/schemas/StitchedLocation"
        granularity:
          type: string
          description: "Temporal granularity of the data (echoes the request param: daily,
            weekly, or monthly)."
          examples:
            - daily
        current_period:
          type: object
          description: Present for weekly/monthly granularity when the in-progress period
            is included. Its elapsed days are aggregated from observed history
            values and its remaining days from the forecast.
          properties:
            label:
              type: string
              description: Period key in `variables.*.statistics` this object refers to
                (`YYYY-W##` or `YYYY-MM`).
              examples:
                - 2025-09
            observed_until:
              type:
                - string
                - "null"
              format: date
              description: Last day whose value comes from observations; null when the period
                contains no observed days.
              examples:
                - 2025-09-17
            forecast_from:
              type: string
              format: date
              description: First day whose value comes from the forecast.
              examples:
                - 2025-09-18
        variables:
          type: object
          description: Map of variable name to its statistics and metadata. Keys are
            variable names (temp_mean, precipitation, etc.) based on request.
          additionalProperties:
            $ref: "#/components/schemas/StitchedStatisticsData"
          examples:
            - temp_mean:
                units: degrees_C
                downscaled: true
                version: v2.1.0
                generation: stitch-gen-123-2025-09-18-12Z
                statistics:
                  2025-01-01:
                    mean: 15.5
                    q05: 12.3
                    q50: 15.1
                    q95: 18.9
      examples:
        - created_at: 2025-09-18T12:00:00Z
          init_time: 2025-09-18T12:00:00Z
          kind: forecast
          location:
            requested:
              lat: 9.119
              lon: -79.4021
            resolved:
              lat: 9.12
              lon: -79.4
          granularity: daily
          variables:
            temp_mean:
              units: degrees_C
              downscaled: true
              version: v2.1.0
              generation: stitch-gen-123-2025-09-18-12Z
              statistics:
                2025-01-01:
                  mean: 15.5
                  q05: 12.3
                  q25: 14.2
                  q50: 15.1
                  q75: 16.8
                  q95: 18.9
                2025-01-02:
                  mean: 16.2
                  q05: 13.1
                  q25: 15
                  q50: 16
                  q75: 17.3
                  q95: 19.2
    StitchedStatisticsData:
      type: object
      properties:
        units:
          type: string
          description: Physical unit of the values (e.g. degrees_C, mm, percent, W/m2,
            km/h).
          examples:
            - degrees_C
        downscaled:
          type: boolean
          description: Whether ~1 km downscaling was applied to this variable.
          examples:
            - true
        version:
          type: string
          description: Dataset version identifier. Tracks the model pipeline version that
            produced the data (e.g. debiasing model, stitching algorithm).
            Changes when the pipeline is updated.
          examples:
            - v2.1.0
        generation:
          type: string
          description: Unique identifier for the specific data generation run. Combines
            the stitching job ID and the init_time. Use this to detect when
            fresh data is available or to reference a specific forecast vintage.
          examples:
            - stitch-gen-123-2025-09-18-12Z
        statistics:
          type: object
          description: >
            Statistics keyed by date/week/month. Each entry contains `mean` plus
            one `qNN` key per requested quantile.
          additionalProperties:
            type: object
            properties:
              mean:
                type: number
            additionalProperties:
              type: number
          examples:
            - 2025-01-01:
                mean: 15.5
                q05: 12.3
                q50: 15.1
                q95: 18.9
