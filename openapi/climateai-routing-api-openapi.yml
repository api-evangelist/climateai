openapi: 3.2.0
info:
  title: ClimateAI Platform Routing API
  version: '1.0'
  description: ClimateAI authentication and routing gateway for platform services
servers:
- url: /
security:
- jwt: []
tags:
- name: Routing
  description: routing and proxy operations
paths:
  /{path}:
    parameters:
    - name: path
      in: path
      required: true
      schema:
        type: string
    post:
      responses:
        '200':
          description: Success
      operationId: postToAnEndpoint
      security:
      - jwt: []
      - apikey: []
      tags:
      - Routing
      summary: Post to an endpoint
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: post to an endpoint
    put:
      responses:
        '200':
          description: Success
      operationId: updateAResource
      security:
      - jwt: []
      - apikey: []
      tags:
      - Routing
      summary: Update a resource
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: update a resource
    delete:
      responses:
        '200':
          description: Success
      operationId: deleteAResource
      security:
      - jwt: []
      - apikey: []
      tags:
      - Routing
      summary: Delete a resource
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: delete a resource
    get:
      responses:
        '200':
          description: Success
      operationId: getAResource
      security:
      - jwt: []
      - apikey: []
      tags:
      - Routing
      summary: Get a resource
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: get a resource
components:
  securitySchemes:
    jwt:
      type: apiKey
      in: header
      name: Authorization
    apikey:
      type: apiKey
      in: header
      name: X-Api-Key
