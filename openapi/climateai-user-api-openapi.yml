openapi: 3.2.0
info:
  title: ClimateAI Platform User API
  version: '1.0'
  description: ClimateAI authentication and routing gateway for platform services
servers:
- url: /
security:
- jwt: []
tags:
- name: User
  description: user related operations
paths:
  /user/:
    post:
      responses:
        '500':
          description: Error creating user.
        '409':
          description: User already exists.
        '201':
          description: User successfully created.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_response'
      operationId: createANewUser
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_user_payload'
        required: true
      summary: Create a new user
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: create a new user
    get:
      responses:
        '500':
          description: Error retrieving users.
        '204':
          description: No users found.
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/user_response'
      summary: List all registered users
      operationId: listAllRegisteredUsers
      tags:
      - User
      x-operation-id-source: normalized
      x-operation-id-original: list all registered users
  /user/change_password:
    post:
      responses:
        '500':
          description: Error changing the user password.
        '404':
          description: User not found.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_pwd_response'
      summary: Changes the user's password
      operationId: ChangesTheUser'sPassword
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_pwd_payload_a'
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: Changes the user's password
  /user/reset_password:
    post:
      responses:
        '500':
          description: Error creating reset token.
        '404':
          description: User not found.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_pwd_response'
      summary: Gets reset password token
      operationId: returnsResetPasswordToken
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_pwd_payload_a'
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: returns reset password token
    put:
      responses:
        '500':
          description: Error resetting password.
        '404':
          description: Password token not found.
        '201':
          description: Successfully reset password.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_response'
      summary: Resets password
      operationId: performsPasswordResetOperation
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: performs password reset operation
  /user/search:
    post:
      responses:
        '200':
          description: Users successfully fetched.
        '500':
          description: Error searching.
        '204':
          description: No users found.
      operationId: SearchUsers
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/search_payload'
        required: true
      summary: Search users
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Search users
  /user/{user_id}/:
    parameters:
    - in: path
      description: The user id
      name: user_id
      required: true
      schema:
        type: string
    put:
      responses:
        '404':
          description: User not found.
        '500':
          description: Error updating user.
        '201':
          description: User successfully updated.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_response'
      operationId: updateAUser
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_update_payload'
        required: true
      summary: Update a user
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: update a user
    delete:
      responses:
        '404':
          description: User not found.
        '500':
          description: Error deleting user.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_response'
      summary: Deletes a user by id
      operationId: deleteAUser
      tags:
      - User
      x-operation-id-source: normalized
      x-operation-id-original: delete a user
    get:
      responses:
        '404':
          description: User not found.
        '500':
          description: Error fetching user.
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_response'
      operationId: fetchAUser
      tags:
      - User
      summary: Fetch a user
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: fetch a user
  /user/{user_id}/account/relation:
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Successfully retrieved information.
        '500':
          description: Error retrieving information.
        '404':
          description: No user found.
        '204':
          description: User does not have any account relations.
      operationId: GetsAccountRelationsAssociatedWithTheUser
      tags:
      - User
      summary: Gets account relations associated with the user
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Gets account relations associated with the user
components:
  schemas:
    user_response:
      required:
      - created_at
      - email
      - id
      - language
      - roles
      - timezone
      - unit_type
      - updated_at
      - username
      properties:
        id:
          type: string
          description: user unique id
        created_at:
          type: string
          description: created timestamp
        updated_at:
          type: string
          description: last updated timestamp
        roles:
          type: array
          description: Roles related to the user
          items:
            $ref: '#/components/schemas/user_role_info'
        email:
          type: string
          description: user email address
        username:
          type: string
          description: user username
        unit_type:
          type: boolean
          description: shows if the users unit_type is metric
        language:
          type: string
          description: Main language used by the account.
        timezone:
          type: string
          description: timezone of the user
        status:
          type: string
          description: user status
          example: active
          enum:
          - active
          - inactive
          - draft
      type: object
    user_update_payload:
      properties:
        username:
          type: string
          description: user username
        unit_type:
          type: boolean
          description: shows if the users unit_type is metric
        language:
          type: string
          description: Main language used by the account.
        timezone:
          type: string
          description: timezone of the user
        status:
          type: string
          description: user status
          example: active
          enum:
          - active
          - inactive
      type: object
      additionalProperties: false
    create_user_payload:
      required:
      - email
      - language
      - password
      - timezone
      - unit_type
      - username
      properties:
        email:
          type: string
          description: user email address
        username:
          type: string
          description: user username
        unit_type:
          type: boolean
          description: shows if the users unit_type is metric
        language:
          type: string
          description: Main language used by the account.
        timezone:
          type: string
          description: timezone of the user
        status:
          type: string
          description: user status
          example: active
          enum:
          - active
          - inactive
          - draft
        password:
          type: string
          description: user password
      type: object
      additionalProperties: false
    search_payload:
      properties:
        filter_by:
          $ref: '#/components/schemas/criteria'
        order_by:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/pagination'
      type: object
    search_filter:
      required:
      - field_name
      - field_value
      - operator
      properties:
        field_name:
          type: string
        operator:
          type: string
        field_value:
          type: string
      type: object
    user_pwd_payload_a:
      required:
      - email
      - password
      properties:
        email:
          type: string
          description: user email address
        password:
          type: string
          description: user password
      type: object
      additionalProperties: false
    user_pwd_response:
      required:
      - created_at
      - email
      - reset_token
      properties:
        reset_token:
          type: string
          description: user password reset token
        email:
          type: string
          description: user email address
        created_at:
          type: string
          description: Token created at timestamp
      type: object
    criteria:
      properties:
        and:
          type: array
          items:
            $ref: '#/components/schemas/search_filter'
        or:
          type: array
          items:
            $ref: '#/components/schemas/search_filter'
      type: object
    user_role_info:
      required:
      - account_id
      - role_id
      properties:
        account_id:
          type: string
          description: Account ID
        role_id:
          type: string
          description: role identifier
      type: object
    pagination:
      properties:
        page:
          type: integer
        per_page:
          type: integer
        all:
          type: boolean
      type: object
  securitySchemes:
    jwt:
      type: apiKey
      in: header
      name: Authorization
    apikey:
      type: apiKey
      in: header
      name: X-Api-Key
