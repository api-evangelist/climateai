- target: $.servers
  description: >-
    Drop the localhost development server from the published contract. A non-routable
    http://localhost:5000 entry in a public spec breaks generated clients and agent
    tooling that pick servers[0..n] without filtering.
  remove: false
  update: null
  x-apievangelist-recommendation: remove-localhost-server
- target: $.components.securitySchemes.ApiKeyAuth
  update:
    x-provisioning: sales@climate.ai
    x-self-service: false
    x-entitlements:
    - name: downscaling-1km
      description: >-
        Bound to the key at the account level. When absent, use_downscaling has no
        effect and responses are served at the native 0.25 degree grid.
- target: $.paths['/v1/history'].get
  description: Superseded by /v2/history per the provider migration guide; not flagged in the source spec.
  update:
