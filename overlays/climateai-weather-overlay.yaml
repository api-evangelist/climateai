    x-apievangelist-recommendation: mark-deprecated
- target: $.paths['/v1/forecast/subseasonal'].get
  update:
    x-apievangelist-superseded-by: getStitchedForecastStatistics
    x-apievangelist-recommendation: mark-deprecated
    x-apievangelist-note: >-
      Weekly responses carry probabilistic terciles that no v2 endpoint exposes; this
      operation cannot be fully replaced today.
- target: $.paths['/v1/forecast/seasonal'].get
