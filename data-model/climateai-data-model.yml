    The weather surface returns dataset responses rather than persisted entities. Shape
    lineage from the OpenAPI schema $refs.
  chains:
  - StitchedForecastResponse -> StitchedLocation + StitchedVariableData
  - StitchedForecastStatisticsResponse -> StitchedLocation + StitchedStatisticsData
  - CompactWeatherResponse -> CompactLocation + CompactVariable
