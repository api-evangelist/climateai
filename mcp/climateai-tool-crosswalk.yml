mcp_only_note: >-
  None. The candidate tool set is a strict projection of published REST operations, so
  there is no MCP-only capability. A real ClimateAi server would most likely add
  composites (e.g. "is this week anomalous versus climatology at this location", which
  today requires calling getStitchedForecastStatistics and getClimatology and comparing
  client-side) — that is the first mcp_only row to expect.
