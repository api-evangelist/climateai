divergences:
- name: v1-only terciles
  detail: >-
    getSubseasonalForecast (weekly) and getSeasonalForecast (monthly) return
    probabilistic terciles [0.00-0.33, 0.33-0.67, 0.67-1.0]. No v2 operation exposes
    them and they cannot be recomputed client-side, because /v1/climatology only
    publishes the [0.05, 0.25, 0.50, 0.75, 0.95] quantiles. A tool set that ships only
    the v2 tools silently drops this capability.
- name: v1-only stored locations
  detail: >-
    The six *ByLocation operations accept a server-side location ID; no v2 equivalent
    exists, and no published operation creates, lists or resolves those IDs.
- name: v2-only date range and custom quantiles
  detail: >-
    start_date/end_date and arbitrary quantiles exist only on the v2 operations, so the
    legacy tools cannot answer range or custom-percentile questions.
