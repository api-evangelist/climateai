agent_notes:
- Every tool is a safe read; there is no destructive operation in this projection.
- Resolution is entitlement-dependent. use_downscaling=true does nothing unless the key is provisioned
  for 1 km, so an agent must read the response meta rather than assume.
- No rate-limit contract is published, so an agent has no budget signal and should apply its own conservative
  backoff.
- see: mcp/climateai-tool-crosswalk.yml
