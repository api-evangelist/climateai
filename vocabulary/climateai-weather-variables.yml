description: >-
  The ClimateAi LensConnect weather variable vocabulary — the slug set accepted by the
  `var` query parameter, its units, which endpoint families expose each variable, and
  which variables can be downscaled to ~1 km. Captured verbatim from the provider's
  "Variables, Units & Resolution" reference page, which the provider names as the source
  of truth for what each endpoint can return.
