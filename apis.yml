    url: overlays/climateai-weather-overlay.yaml
  - type: Examples
    url: examples/climateai-weather-examples.yml
  - type: Documentation
    url: https://docs.climate.ai/
  - type: APIReference
    url: https://docs.climate.ai/climateai-weather-api
  - type: GettingStarted
    url: https://docs.climate.ai/guide/getting-started
- aid: climateai:platform
  name: ClimateAI Platform API
  description: 'ClimateAI authentication and routing gateway for platform services. Covers
    accounts, account configuration, users, roles, permissions, device API keys, products,
    platform labels, reports, transactional email and request routing/proxying. Authenticated
    with a JWT Authorization header or an X-Api-Key device key.'
  humanURL: https://api-prod.climate.ai/docs
  baseURL: https://api-prod.climate.ai
  tags:
  - Authentication
