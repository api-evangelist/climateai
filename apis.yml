apis:
- aid: climateai:weather
  name: ClimateAi Weather API (LensConnect)
  description: 'The LensConnect weather and climate data API. Forecasts, historical observations
    and climatology for any point on Earth, addressed by latitude and longitude. Current (v2)
    endpoints return AI-stitched multi-timescale forecasts with custom quantiles, configurable
    granularity and date-range control; legacy (v1) endpoints expose short-term, subseasonal
    and seasonal horizons separately plus climatology and stored-location variants. Authenticated
    with an X-Api-Key header.'
  humanURL: https://docs.climate.ai/climateai-weather-api
  baseURL: https://api-prod.climate.ai/weather
  tags:
  - Weather
  - Climate
  - Forecasting
  - History
  - Climatology
