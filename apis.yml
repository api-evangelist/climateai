  name: ClimateAI Platform API
  description: >-
    ClimateAI authentication and routing gateway for platform services. Covers accounts, account configuration,
    users, roles, permissions, device API keys, products, platform labels, reports, transactional email
    and request routing/proxying. Authenticated with a JWT Authorization header or an X-Api-Key device
    key.
  humanURL: https://api-prod.climate.ai/docs
