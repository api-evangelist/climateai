aid: climateai
name: ClimateAI
description: 'ClimateAi (climate.ai) is a climate-intelligence company that turns global
  weather, climate and extreme-event modeling into decision-grade forecasts for agriculture,
  food and beverage, manufacturing, energy, finance, retail and federal/defense customers.
  Its ClimateLens products cover risk screening, monitoring and adaptation, and its developer
  surface is the LensConnect API — a REST weather and climate data API addressed by latitude
  and longitude that returns 30+ years of history (1995-present, ERA5-backed), a fixed 30-year
  climatology baseline, and AI-stitched probabilistic forecasts running from short-term through
  seasonal (~6 months) in a single continuous timeline, at ~25 km resolution with optional 1 km
  downscaling for select variables. A separate ClimateAI Platform gateway handles accounts,
  users, roles, permissions, device API keys and product routing.'
url: https://raw.githubusercontent.com/api-evangelist/climateai/refs/heads/main/apis.yml
image: https://climate.ai/wp-content/uploads/2022/09/Logo_orange_dark.png
x-type: company
x-source: harvest:secondary-market
x-tier: profiled
x-tier-reason: enrichment-pipeline
